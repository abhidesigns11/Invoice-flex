name: Build & Export APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # No android-actions/setup-android step: ubuntu-latest runners already
      # ship a current Android SDK. That action was pulling ancient
      # cmdline-tools (16.0) and is what was failing.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Environment & Config Files
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Restore or Generate Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x ./gradlew 2>/dev/null || true

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create Source ZIP
        run: git archive --format=zip --output=source.zip HEAD

      - name: Upload Source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: source-code
          path: source.zip
