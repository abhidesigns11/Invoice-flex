name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug

permissions:
  contents: write

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Environment & Config Files
        run: |
          echo "Setting up environment files..."
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
              echo "Created .env from .env.example"
            else
              touch .env
              echo "Created empty .env"
            fi
          fi

      - name: Restore or Generate Debug Keystore
        run: |
          echo "Checking debug.keystore..."
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Decoding debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating new debug keystore..."
              keytool -genkey -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          ls -la debug.keystore

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate Generated APK
        id: apk_path
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found in app/build/outputs/apk/debug"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          ls -lh "$APK_FILE"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BillNova-Debug-APK
          path: ${{ steps.apk_path.outputs.apk_path }}
          retention-days: 30

      - name: Display Summary
        run: |
          echo "### 🚀 Build Successful! :sparkles:" >> $GITHUB_STEP_SUMMARY
          echo "The Android APK has been built and uploaded as a workflow artifact." >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Name:** BillNova-Debug-APK" >> $GITHUB_STEP_SUMMARY
          echo "- **Location:** Go to the summary page of this action run and download from the **Artifacts** section." >> $GITHUB_STEP_SUMMARY
